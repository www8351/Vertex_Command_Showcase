    <script>
    (function(){
      var _origError = Error;
      var _lastThrown = null;
      var _patchedThrow = function(){
        try { throw new _origError('stack-trace'); } catch(e) { _lastThrown = e.stack; }
      };
      window.onerror=function(m,s,l,c,err){
        if(typeof m==='string'&&(m.indexOf('ResizeObserver')!==-1||m==='Script error.'))return true;
        console.warn('[TRAP-ONERROR]',JSON.stringify({msg:String(m),src:String(s),line:l,col:c,errType:typeof err,errVal:String(err),errIsNull:err===null,errIsUndef:err===undefined}));
        return true;
      };
      window.addEventListener('error',function(e){
        var m=e&&e.message||'';
        if(m.indexOf('ResizeObserver')!==-1)return;
        console.warn('[TRAP-ERROR]',JSON.stringify({msg:m,file:e.filename,line:e.lineno,col:e.colno,errType:typeof e.error,errVal:String(e.error),errIsNull:e.error===null,errIsUndef:e.error===undefined,isTrusted:e.isTrusted,target:e.target?e.target.tagName:'none'}));
        e.stopImmediatePropagation();e.preventDefault();
      },true);
      window.addEventListener('unhandledrejection',function(e){
        var r=e.reason;
        _patchedThrow();
        console.warn('[TRAP-REJECT]',JSON.stringify({type:typeof r,val:String(r),isError:r instanceof Error,isNull:r===null,isUndef:r===undefined,stack:r&&r.stack?r.stack.substring(0,500):'',keys:r&&typeof r==='object'?Object.keys(r).join(','):'',trace:_lastThrown?_lastThrown.substring(0,500):''}));
        e.preventDefault();e.stopImmediatePropagation();
      },true);
    })();
    </script>
